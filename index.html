<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINELA - Controle de Validade</title>
    <!-- Biblioteca do Leitor de Código de Barras -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-secondary: #b0b0b0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            margin: 0;
            letter-spacing: 1px;
            color: var(--accent-green);
        }
        .subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .badge {
            background-color: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        /* Cards de Resumo */
        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }
        .card-full {
            grid-column: span 2;
        }
        .indicator-line {
            height: 4px;
            width: 30px;
            background-color: #ff5252;
            border-radius: 2px;
            margin-top: 8px;
        }
        .indicator-yellow { background-color: #ffab40; }
        
        /* Botões de Ação Principal */
        .grid-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn-primary {
            background-color: var(--accent-green);
            color: #000;
        }
        .btn:active { transform: scale(0.97); }

        /* Formulários e Modais / Seções */
        .section-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .section-box.active { display: block; }
        
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        label { font-size: 13px; color: var(--text-secondary); }

        /* Leitor de camera */
        #reader, #reader-prod {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        /* Alerta de Sucesso */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-green);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(0,230,118,0.4);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SENTINELA</h1>
            <div class="subtitle">CONTROLE DE VALIDADE · CONVENIÊNCIA</div>
        </div>
        <div class="badge">VERSÃO PILOTO</div>
    </header>

    <!-- Resumo da Tela Inicial -->
    <div class="grid-stats">
        <div class="card">
            <div class="card-title">Produtos cadastrados</div>
            <div class="card-value" id="val-produtos">-</div>
        </div>
        <div class="card">
            <div class="card-title">Lotes ativos</div>
            <div class="card-value" id="val-lotes">-</div>
        </div>
        <div class="card">
            <div class="card-title">Vencidos</div>
            <div class="card-value" id="val-vencidos">-</div>
            <div class="indicator-line"></div>
        </div>
        <div class="card">
            <div class="card-title">Vencem em até 7 dias</div>
            <div class="card-value" id="val-7dias">-</div>
            <div class="indicator-line indicator-yellow"></div>
        </div>
    </div>

    <!-- Botões Principais -->
    <div class="grid-actions">
        <button class="btn btn-primary" onclick="abrirSecao('lote')">+ Registrar validade</button>
        <button class="btn" onclick="abrirSecao('produto')">+ Cadastrar produto</button>
    </div>

    <!-- Seção: Registrar Validade / Lote -->
    <div id="secao-lote" class="section-box">
        <h3 style="margin-top:0; color:var(--accent-green);">Registar Validade de Lote</h3>
        
        <div id="reader"></div>
        <button class="btn" style="width:100%; margin-bottom:15px; background:#333;" onclick="iniciarCamera('lote')">📷 Ligar Câmara / Ler Código</button>
        
        <label>Código de Barras:</label>
        <input type="text" id="lote-codigo" placeholder="Escaneie ou digite..." onblur="buscarProdutoAPI(this.value)">

        <label>Nome do Produto:</label>
        <input type="text" id="lote-nome" placeholder="Nome preenchido automaticamente...">

        <label>Data de Vencimento:</label>
        <input type="date" id="lote-validade">

        <label>Quantidade:</label>
        <input type="number" id="lote-qtd" value="1">

        <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="salvarLote()">Salvar Lote</button>
        <button class="btn" style="width:100%; margin-top:10px; background:#444;" onclick="fecharSecoes()">Cancelar</button>
    </div>

    <!-- Seção: Cadastrar Novo Produto -->
    <div id="secao-produto" class="section-box">
        <h3 style="margin-top:0; color:var(--accent-green);">Cadastrar Novo Produto</h3>

        <div id="reader-prod"></div>
        <button class="btn" style="width:100%; margin-bottom:15px; background:#333;" onclick="iniciarCamera('produto')">📷 Ler Código do Produto</button>

        <label>Código de Barras:</label>
        <input type="text" id="prod-codigo" placeholder="Escaneie ou digite...">

        <label>Nome do Produto:</label>
        <input type="text" id="prod-nome" placeholder="Ex: Cerveja Lata 350ml">

        <label>Categoria:</label>
        <input type="text" id="prod-categoria" placeholder="Ex: Bebidas">

        <label>Localização na Loja:</label>
        <input type="text" id="prod-local" placeholder="Ex: Geladeira 02">

        <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="salvarProduto()">Registar Produto</button>
        <button class="btn" style="width:100%; margin-top:10px; background:#444;" onclick="fecharSecoes()">Cancelar</button>
    </div>

    <!-- Toast de Sucesso -->
    <div id="toast">Operação realizada com sucesso!</div>

    <script>
        // COLOQUE ABAIXO O SEU LINK DE IMPLANTAÇÃO DO GOOGLE APPS SCRIPT TERMINADO EM /exec
        const URL_API = "https://script.google.com/macros/s/AKfycbwr2XVOSJ4zfKd1X83liNymDdzZmi-yerdkxmUP3Xoo9N6Mo-Xqmyj28WPgKTdsc5Smg/exec";

        let html5QrCode = null;

        window.onload = function() {
            carregarResumo();
        };

        function carregarResumo() {
            if(URL_API.includes("SEU_ID")) return;
            fetch(URL_API)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('val-produtos').innerText = data.produtosCadastrados || 0;
                    document.getElementById('val-lotes').innerText = data.lotesAtivos || 0;
                    document.getElementById('val-vencidos').innerText = data.vencidos || 0;
                    document.getElementById('val-7dias').innerText = data.vencem7Dias || 0;
                }).catch(err => console.log("Erro ao carregar resumo", err));
        }

        function abrirSecao(tipo) {
            fecharSecoes();
            if(tipo === 'lote') {
                document.getElementById('secao-lote').classList.add('active');
            } else {
                document.getElementById('secao-produto').classList.add('active');
            }
        }

        function fecharSecoes() {
            document.getElementById('secao-lote').classList.remove('active');
            document.getElementById('secao-produto').classList.remove('active');
            pararCamera();
        }

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.innerText = mensagem;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function iniciarCamera(destino) {
            pararCamera();
            const elementId = destino === 'lote' ? 'reader' : 'reader-prod';
            
            html5QrCode = new Html5Qrcode(elementId);
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    if(destino === 'lote') {
                        document.getElementById('lote-codigo').value = decodedText;
                        buscarProdutoAPI(decodedText);
                    } else {
                        document.getElementById('prod-codigo').value = decodedText;
                    }
                    pararCamera();
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Erro ao aceder à câmara: " + err);
            });
        }

        function pararCamera() {
            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        function buscarProdutoAPI(codigo) {
            if(!codigo || URL_API.includes("SEU_ID")) return;
            fetch(`${URL_API}?acao=produto&codigo=${codigo}`)
                .then(res => res.json())
                .then(data => {
                    if(data.encontrado) {
                        document.getElementById('lote-nome').value = data.produto;
                        mostrarToast("Produto encontrado: " + data.produto);
                    } else {
                        document.getElementById('lote-nome').value = "";
                        mostrarToast("⚠️ Produto novo. Cadastre-o primeiro!");
                    }
                }).catch(err => console.log(err));
        }

        function salvarLote() {
            const dados = {
                tipo: "lote",
                codigoBarras: document.getElementById('lote-codigo').value,
                produto: document.getElementById('lote-nome').value,
                validade: document.getElementById('lote-validade').value,
                quantidade: document.getElementById('lote-qtd').value
            };

            if(!dados.codigoBarras || !dados.validade) {
                alert("Preencha o código de barras e a validade!");
                return;
            }

            enviarParaPlanilha(dados, "Validade registada com sucesso! 🚀");
        }

        function salvarProduto() {
            const dados = {
                tipo: "produto",
                codigoBarras: document.getElementById('prod-codigo').value,
                produto: document.getElementById('prod-nome').value,
                categoria: document.getElementById('prod-categoria').value,
                localizacao: document.getElementById('prod-local').value
            };

            if(!dados.codigoBarras || !dados.produto) {
                alert("Preencha o código e o nome do produto!");
                return;
            }

            enviarParaPlanilha(dados, "Produto cadastrado com sucesso! 📦");
        }

        function enviarParaPlanilha(dados, mensagemSucesso) {
            if(URL_API.includes("SEU_ID")) {
                alert("Por favor, configure a URL_API com o link do Google Apps Script.");
                return;
            }

            fetch(URL_API, {
                method: "POST",
                body: JSON.stringify(dados)
            })
            .then(res => res.json())
            .then(response => {
                if(response.status === "sucesso") {
                    mostrarToast(mensagemSucesso);
                    fecharSecoes();
                    carregarResumo();
                } else {
                    alert("Erro ao salvar: " + response.mensagem);
                }
            })
            .catch(err => {
                alert("Erro de conexão com a planilha.");
                console.error(err);
            });
        }
    </script>
</body>
</html>
